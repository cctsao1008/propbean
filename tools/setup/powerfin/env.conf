# PowerFin upstream definition used by PropBean setup tooling.
# Keep this file declarative: scripts source it directly.

POWERFIN_SDK_URL="https://github.com/HumpbackLab/powerfin_sdk.git"
POWERFIN_SDK_DIR="third_party/powerfin-sdk"

POWERFIN_MANIFEST_URL="https://github.com/HumpbackLab/manifest.git"
POWERFIN_MANIFEST_BRANCH="master"
POWERFIN_MANIFEST_NAME="powerfin.xml"
POWERFIN_REPO_DEPTH="1"
POWERFIN_SYNC_JOBS="4"

POWERFIN_DEFCONFIG="powerfin_buildroot_spinor_defconfig"

# The current upstream PowerFin CI builds Python 2.7.18 from source for U-Boot.
PYTHON2_VERSION="2.7.18"
PYTHON2_URL="https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz"
